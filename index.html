<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ViTube</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:#fff;
 color:#111;
}

button{
 cursor:pointer;
}

.header{
 height:64px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:0 16px;
 border-bottom:1px solid #ddd;
 position:sticky;
 top:0;
 background:#fff;
 z-index:1000;
}

.logo{
 color:#e60023;
 font-size:27px;
 font-weight:800;
 cursor:pointer;
}

.menu{
 border:0;
 background:none;
 font-size:23px;
}

.search{
 flex:1;
 max-width:650px;
 margin:auto;
 display:flex;
}

.search input{
 flex:1;
 height:42px;
 border:1px solid #ccc;
 border-radius:22px 0 0 22px;
 padding:0 16px;
 font-size:15px;
}

.search button{
 width:55px;
 border:1px solid #ccc;
 border-left:0;
 border-radius:0 22px 22px 0;
}

.head-actions{
 display:flex;
 align-items:center;
 gap:5px;
}

.head-btn{
 border:0;
 background:none;
 font-size:21px;
 padding:8px;
}

.avatar{
 width:38px;
 height:38px;
 border:0;
 border-radius:50%;
 background:#e60023;
 color:white;
 font-weight:bold;
}

.sidebar{
 position:fixed;
 top:64px;
 left:-260px;
 width:245px;
 height:calc(100vh - 64px);
 background:white;
 border-right:1px solid #ddd;
 padding:15px;
 z-index:900;
 transition:.25s;
}

.sidebar.open{
 left:0;
}

.sidebar button{
 width:100%;
 padding:13px;
 border:0;
 background:white;
 text-align:left;
 border-radius:8px;
 font-size:15px;
 margin-bottom:5px;
}

.sidebar button:hover{
 background:#f2f2f2;
}

.profile-menu{
 display:none;
 position:absolute;
 right:12px;
 top:58px;
 width:230px;
 background:white;
 border:1px solid #ddd;
 border-radius:12px;
 padding:8px;
 box-shadow:0 8px 30px rgba(0,0,0,.15);
 z-index:2000;
}

.profile-menu button{
 width:100%;
 border:0;
 background:white;
 text-align:left;
 padding:12px;
 border-radius:8px;
}

.profile-menu button:hover{
 background:#f2f2f2;
}

.container{
 max-width:1400px;
 margin:auto;
 padding:20px;
}

.hero{
 background:#111;
 color:white;
 border-radius:15px;
 padding:35px;
 margin-bottom:25px;
}

.hero h1{
 font-size:34px;
 margin-bottom:10px;
}

.hero p{
 color:#ddd;
}

.title{
 font-size:23px;
 margin:22px 0 15px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:20px;
}

.card{
 cursor:pointer;
}

.thumb{
 width:100%;
 aspect-ratio:16/9;
 background:#eee;
 border-radius:12px;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
}

.thumb img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.demo-thumb{
 font-size:55px;
}

.card-title{
 font-size:16px;
 font-weight:bold;
 margin-top:8px;
 line-height:1.35;
}

.meta{
 color:#666;
 font-size:13px;
 margin-top:5px;
}

.watch{
 max-width:1050px;
 margin:auto;
}

.player{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 border-radius:12px;
 overflow:hidden;
}

.player video{
 width:100%;
 height:100%;
}

.watch-title{
 font-size:24px;
 margin:18px 0;
}

.channel-row{
 display:flex;
 align-items:center;
 gap:12px;
 padding:10px 0;
}

.channel-avatar{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#ddd;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 overflow:hidden;
}

.channel-avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.channel-info{
 flex:1;
}

.channel-name{
 font-weight:bold;
}

.subscribe{
 background:#111;
 color:white;
 border:0;
 border-radius:22px;
 padding:11px 18px;
 font-weight:bold;
}

.subscribe.active{
 background:#eee;
 color:#111;
}

.bell{
 width:42px;
 height:42px;
 border:0;
 border-radius:50%;
 background:#eee;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 border-bottom:1px solid #ddd;
 padding:12px 0 18px;
}

.action{
 border:0;
 background:#eee;
 padding:10px 15px;
 border-radius:20px;
 font-weight:bold;
}

.description{
 padding:18px 0;
 line-height:1.6;
}

.comments{
 margin-top:20px;
}

.comment-form{
 display:flex;
 gap:8px;
 margin:15px 0;
}

.comment-form input{
 flex:1;
 padding:13px;
 border:1px solid #ccc;
 border-radius:22px;
}

.comment-form button{
 border:0;
 background:#e60023;
 color:white;
 padding:0 20px;
 border-radius:22px;
}

.comment{
 border-bottom:1px solid #eee;
 padding:13px 0;
}

.modal-bg{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.55);
 align-items:center;
 justify-content:center;
 z-index:5000;
 padding:20px;
}

.modal{
 width:100%;
 max-width:450px;
 max-height:90vh;
 overflow:auto;
 background:white;
 border-radius:15px;
 padding:25px;
}

.modal h2{
 margin-bottom:18px;
}

.modal input,
.modal textarea,
.modal select{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:8px;
 margin-bottom:12px;
}

.primary{
 width:100%;
 padding:13px;
 border:0;
 background:#e60023;
 color:white;
 border-radius:8px;
 font-weight:bold;
}

.secondary{
 width:100%;
 padding:13px;
 border:0;
 background:#eee;
 border-radius:8px;
 margin-top:8px;
}

.close{
 float:right;
 border:0;
 background:none;
 font-size:24px;
}

.empty{
 text-align:center;
 padding:50px;
 color:#777;
}

@media(max-width:900px){
 .grid{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:600px){

 .header{
  padding:0 8px;
  gap:6px;
 }

 .logo{
  font-size:21px;
 }

 .container{
  padding:12px;
 }

 .grid{
  grid-template-columns:1fr;
 }

 .hero{
  padding:25px;
 }

 .hero h1{
  font-size:27px;
 }

 .watch-title{
  font-size:20px;
 }

 .search{
  max-width:none;
 }

 .upload-head{
  display:none;
 }

}

</style>
</head>

<body>


<header class="header">

<button class="menu" onclick="toggleSidebar()">☰</button>

<div class="logo" onclick="home()">ViTube</div>

<div class="search">

<input
 id="searchInput"
 type="search"
 placeholder="Search videos..."
 onkeydown="if(event.key==='Enter')searchVideos()">

<button onclick="searchVideos()">🔍</button>

</div>

<div class="head-actions">

<button class="head-btn upload-head"
 onclick="openUpload()">＋</button>

<button class="head-btn"
 onclick="notifications()">🔔</button>

<button class="avatar"
 id="avatar"
 onclick="toggleProfile()">G</button>

</div>

<div class="profile-menu" id="profileMenu">

<button onclick="account()">👤 Account</button>

<button onclick="openUpload()">⬆️ Upload Video</button>

<button onclick="notifications()">🔔 Notifications</button>

<button onclick="logout()">🚪 Sign out</button>

</div>

</header>


<aside class="sidebar" id="sidebar">

<button onclick="home()">🏠 Home</button>

<button onclick="home()">🔥 Trending</button>

<button onclick="home()">🌎 Explore</button>

<button onclick="openUpload()">⬆️ Upload</button>

<button onclick="account()">👤 Account</button>

</aside>


<main class="container" id="app"></main>


<!-- LOGIN -->

<div class="modal-bg" id="loginModal">

<div class="modal">

<button class="close" onclick="closeModal('loginModal')">×</button>

<h2>Sign in to ViTube</h2>

<input
 id="loginEmail"
 type="email"
 placeholder="Gmail / Email">

<input
 id="loginPassword"
 type="password"
 placeholder="Password">

<button class="primary" onclick="login()">
Sign In
</button>

<button class="secondary" onclick="signupOpen()">
Create Account
</button>

</div>

</div>


<!-- SIGNUP -->

<div class="modal-bg" id="signupModal">

<div class="modal">

<button class="close" onclick="closeModal('signupModal')">×</button>

<h2>Create ViTube Account</h2>

<input
 id="signupEmail"
 type="email"
 placeholder="Gmail / Email">

<input
 id="signupPassword"
 type="password"
 placeholder="Password">

<input
 id="signupUsername"
 type="text"
 placeholder="Username">

<input
 id="signupName"
 type="text"
 placeholder="Display Name">

<button class="primary" onclick="signup()">
Create Account
</button>

<p style="margin-top:12px;color:#666;font-size:13px">
After signup, check your Gmail/email and confirm your account.
</p>

</div>

</div>


<!-- ACCOUNT -->

<div class="modal-bg" id="accountModal">

<div class="modal">

<button class="close"
onclick="closeModal('accountModal')">×</button>

<h2>My ViTube Account</h2>

<div id="accountBox"></div>

</div>

</div>


<!-- CHANNEL -->

<div class="modal-bg" id="channelModal">

<div class="modal">

<button class="close"
onclick="closeModal('channelModal')">×</button>

<h2>Create Channel</h2>

<input
 id="channelName"
 placeholder="Channel name">

<input
 id="channelHandle"
 placeholder="@handle">

<textarea
 id="channelDescription"
 rows="4"
 placeholder="Channel description"></textarea>

<button class="primary"
onclick="createChannel()">
Create Channel
</button>

</div>

</div>


<!-- UPLOAD -->

<div class="modal-bg" id="uploadModal">

<div class="modal">

<button class="close"
onclick="closeModal('uploadModal')">×</button>

<h2>Upload Video</h2>

<input
 id="videoTitle"
 placeholder="Video title">

<textarea
 id="videoDescription"
 rows="4"
 placeholder="Description"></textarea>

<select id="channelSelect"></select>

<input
 id="videoFile"
 type="file"
 accept="video/*">

<input
 id="thumbnailFile"
 type="file"
 accept="image/*">

<button class="primary"
onclick="uploadVideo()">
Upload Video
</button>

<p id="uploadStatus"
style="margin-top:12px;color:#666">
</p>

</div>

</div>


<script>


/* =====================================================
   SUPABASE CONFIG
   =====================================================

   Replace only the two values below.

   Use your:
   1. Project URL
   2. Publishable key

   NEVER put the Supabase Secret Key here.
   ===================================================== */

const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL';

const SUPABASE_PUBLISHABLE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';


let supabase=null;
let currentUser=null;
let currentVideo=null;


/* =====================================================
   INITIALIZE
   ===================================================== */

if(
 SUPABASE_URL &&
 SUPABASE_PUBLISHABLE_KEY &&
 !SUPABASE_URL.includes('YOUR_') &&
 !SUPABASE_PUBLISHABLE_KEY.includes('YOUR_')
){

 supabase=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
   auth:{
    autoRefreshToken:true,
    persistSession:true,
    detectSessionInUrl:true
   }
  }
 );

}


document.addEventListener('DOMContentLoaded',async()=>{

 if(supabase){

  const {data}=await supabase.auth.getSession();

  currentUser=data.session?.user || null;

  supabase.auth.onAuthStateChange(
   (_event,session)=>{
    currentUser=session?.user || null;
    updateAvatar();
   }
  );

 }

 updateAvatar();

 home();

});


/* =====================================================
   HEADER
   ===================================================== */

function updateAvatar(){

 const a=document.getElementById('avatar');

 if(currentUser){

  a.textContent=
   (currentUser.email||'U')
   .charAt(0)
   .toUpperCase();

 }else{

  a.textContent='G';

 }

}


function toggleSidebar(){

 document
  .getElementById('sidebar')
  .classList.toggle('open');

}


function toggleProfile(){

 const p=document.getElementById('profileMenu');

 p.style.display=
  p.style.display==='block'
  ? 'none'
  : 'block';

}


/* =====================================================
   HOME
   ===================================================== */

async function home(){

 currentVideo=null;

 document.getElementById('app').innerHTML=`

 <section class="hero">

  <h1>Welcome to ViTube</h1>

  <p>
   Watch, upload and discover videos from around the world.
  </p>

 </section>

 <h2 class="title">Recommended Videos</h2>

 <div id="videoGrid" class="grid">

  <div class="empty">
   Loading videos...
  </div>

 </div>

 `;

 await loadVideos();

}


async function loadVideos(){

 const box=document.getElementById('videoGrid');

 if(!supabase){

  box.innerHTML=demoVideos();

  return;

 }

 const {data,error}=await supabase
  .from('videos')
  .select('*,channels(name,avatar_url)')
  .order('created_at',{ascending:false});

 if(error || !data || !data.length){

  box.innerHTML=demoVideos();

  return;

 }

 box.innerHTML=data.map(videoCard).join('');

}


function videoCard(v){

 const channel=v.channels?.name || 'ViTube Creator';

 const image=v.thumbnail_url
  ? `<img src="${esc(v.thumbnail_url)}">`
  : `<div class="demo-thumb">▶️</div>`;

 return `

 <article class="card"
  onclick="openVideo('${v.id}')">

  <div class="thumb">
   ${image}
  </div>

  <div class="card-title">
   ${esc(v.title)}
  </div>

  <div class="meta">
   ${esc(channel)} ·
   ${Number(v.views||0).toLocaleString()} views
  </div>

 </article>

 `;

}


/* =====================================================
   DEMO VIDEOS
   ===================================================== */

function demoVideos(){

 const list=[

  ['demo1','🌍','Discover The World','ViTube World'],
  ['demo2','💻','Future Technology','ViTube Tech'],
  ['demo3','🍔','Amazing Food','ViTube Food'],
  ['demo4','🌎','Beautiful Planet Earth','ViTube Nature'],
  ['demo5','🚀','Future Of Space','ViTube Science'],
  ['demo6','🏙️','Amazing Cities','ViTube Travel'],
  ['demo7','🎮','Gaming World','ViTube Gaming'],
  ['demo8','🎵','Music Around The World','ViTube Music']

 ];

 return list.map(v=>`

 <article class="card"
 onclick="demoWatch('${v[0]}')">

  <div class="thumb">
   <div class="demo-thumb">${v[1]}</div>
  </div>

  <div class="card-title">
   ${v[2]}
  </div>

  <div class="meta">
   ${v[3]} · ViTube
  </div>

 </article>

 `).join('');

}


/* =====================================================
   REAL VIDEO
   ===================================================== */

async function openVideo(id){

 if(!supabase){

  demoWatch('demo1');

  return;

 }

 const {data,error}=await supabase
  .from('videos')
  .select(`
   *,
   channels(
    id,
    name,
    handle,
    avatar_url,
    description
   )
  `)
  .eq('id',id)
  .single();

 if(error || !data){

  alert('Video could not be loaded.');

  return;

 }

 currentVideo=data;

 await supabase
  .from('videos')
  .update({
   views:Number(data.views||0)+1
  })
  .eq('id',id);

 renderWatch(data);

}


/* =====================================================
   DEMO WATCH PAGE
   ===================================================== */

function demoWatch(id){

 const demos={

  demo1:['🌍','Discover The World','ViTube World'],
  demo2:['💻','Future Technology','ViTube Tech'],
  demo3:['🍔','Amazing Food','ViTube Food'],
  demo4:['🌎','Beautiful Planet Earth','ViTube Nature'],
  demo5:['🚀','Future Of Space','ViTube Science'],
  demo6:['🏙️','Amazing Cities','ViTube Travel'],
  demo7:['🎮','Gaming World','ViTube Gaming'],
  demo8:['🎵','Music Around The World','ViTube Music']

 };

 const v=demos[id] || demos.demo1;

 document.getElementById('app').innerHTML=`

 <div class="watch">

  <div class="player">

   <div style="
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:90px">

    ${v[0]}

   </div>

  </div>

  <h1 class="watch-title">
   ${v[1]}
  </h1>

  <div class="channel-row">

   <div class="channel-avatar">
    ${v[0]}
   </div>

   <div class="channel-info">

    <div class="channel-name">
     ${v[2]}
    </div>

    <div class="meta">
     ViTube Channel
    </div>

   </div>

   <button
    class="subscribe"
    onclick="needLogin()">

    Subscribe

   </button>

   <button
    class="bell"
    onclick="needLogin()">

    🔔

   </button>

  </div>

  <div class="actions">

   <button class="action"
   onclick="needLogin()">
   👍 Like
   </button>

   <button class="action">
   👎 Dislike
   </button>

   <button class="action"
   onclick="shareVideo()">
   ↗ Share
   </button>

   <button class="action"
   onclick="copyLink()">
   🔗 Copy Link
   </button>

  </div>

  <div class="description">

   Welcome to ViTube.
   Discover videos from creators around the world.

  </div>

  <div class="comments">

   <h2>Comments</h2>

   <div class="comment-form">

    <input
    placeholder="Sign in to comment..."
    onclick="needLogin()">

    <button onclick="needLogin()">
     Comment
    </button>

   </div>

  </div>

  <h2 class="title">
   More videos
  </h2>

  <div class="grid">
   ${demoVideos()}
  </div>

 </div>

 `;

}


/* =====================================================
   REAL WATCH PAGE
   ===================================================== */

async function renderWatch(v){

 const c=v.channels || {};

 document.getElementById('app').innerHTML=`

 <div class="watch">

  <div class="player">

   <video
    controls
    playsinline
    src="${esc(v.video_url)}">
   </video>

  </div>

  <h1 class="watch-title">
   ${esc(v.title)}
  </h1>

  <div class="channel-row">

   <div class="channel-avatar">

    ${
     c.avatar_url
     ? `<img src="${esc(c.avatar_url)}">`
     : esc((c.name||'V').charAt(0).toUpperCase())
    }

   </div>

   <div class="channel-info">

    <div class="channel-name">
     ${esc(c.name||'ViTube Creator')}
    </div>

    <div class="meta">
     ${Number(v.views||0).toLocaleString()} views
    </div>

   </div>

   <button
    id="subscribeButton"
    class="subscribe"
    onclick="subscribe('${v.channel_id}')">

    Subscribe

   </button>

   <button
    id="bellButton"
    class="bell"
    onclick="bell()">

    🔔

   </button>

  </div>

  <div class="actions">

   <button class="action"
   onclick="like('${v.id}',true)">
   👍 Like
   </button>

   <button class="action"
   onclick="like('${v.id}',false)">
   👎 Dislike
   </button>

   <button class="action"
   onclick="shareVideo()">
   ↗ Share
   </button>

   <button class="action"
   onclick="copyLink()">
   🔗 Copy Link
   </button>

  </div>

  <div class="description">
   ${esc(v.description||'')}
  </div>

  <div class="comments">

   <h2>Comments</h2>

   <div class="comment-form">

    <input
     id="commentInput"
     placeholder="Write a comment...">

    <button
     onclick="addComment('${v.id}')">
     Comment
    </button>

   </div>

   <div id="commentsBox">
    Loading comments...
   </div>

  </div>

  <h2 class="title">
   More videos
  </h2>

  <div id="recommended"
   class="grid">
   Loading...
  </div>

 </div>

 `;

 await loadComments(v.id);

 await loadRecommended(v.id);

}


/* =====================================================
   SUBSCRIBE
   ===================================================== */

async function subscribe(channelId){

 if(!currentUser){

  needLogin();

  return;

 }

 const {data}=await supabase
  .from('channel_followers')
  .select('*')
  .eq('channel_id',channelId)
  .eq('follower_id',currentUser.id)
  .maybeSingle();

 if(data){

  await supabase
   .from('channel_followers')
   .delete()
   .eq('channel_id',channelId)
   .eq('follower_id',currentUser.id);

 }else{

  await supabase
   .from('channel_followers')
   .insert({
    channel_id:channelId,
    follower_id:currentUser.id
   });

 }

 const b=document.getElementById('subscribeButton');

 if(b){

  b.textContent=data
   ? 'Subscribe'
   : 'Subscribed';

  b.classList.toggle(
   'active',
   !data
  );

 }

}


/* =====================================================
   BELL
   ===================================================== */

function bell(){

 if(!currentUser){

  needLogin();

  return;

 }

 const b=document.getElementById('bellButton');

 b.textContent=
  b.textContent==='🔔'
  ? '🔕'
  : '🔔';

}


/* =====================================================
   LIKE
   ===================================================== */

async function like(videoId,isLike){

 if(!currentUser){

  needLogin();

  return;

 }

 const {data}=await supabase
  .from('video_likes')
  .select('*')
  .eq('video_id',videoId)
  .eq('user_id',currentUser.id)
  .maybeSingle();

 if(data){

  if(data.is_like===isLike){

   await supabase
    .from('video_likes')
    .delete()
    .eq('video_id',videoId)
    .eq('user_id',currentUser.id);

  }else{

   await supabase
    .from('video_likes')
    .update({is_like:isLike})
    .eq('video_id',videoId)
    .eq('user_id',currentUser.id);

  }

 }else{

  await supabase
   .from('video_likes')
   .insert({
    video_id:videoId,
    user_id:currentUser.id,
    is_like:isLike
   });

 }

}


/* =====================================================
   COMMENTS
   ===================================================== */

async function loadComments(videoId){

 const box=document.getElementById('commentsBox');

 const {data,error}=await supabase
  .from('comments')
  .select('*')
  .eq('video_id',videoId)
  .order('created_at',{ascending:false});

 if(error){

  box.innerHTML='Comments unavailable.';

  return;

 }

    language:'en'
   });

 );

/* =====================================================
   UPLOAD VIDEO
   ===================================================== */

async function uploadVideo(){

 if(!currentUser){

  needLogin();

  return;

 }

 const title=document
  .getElementById('videoTitle')
  .value
  .trim();

 const description=document
  .getElementById('videoDescription')
  .value
  .trim();

 const channelId=document
  .getElementById('channelSelect')
  .value;

 const video=document
  .getElementById('videoFile')
  .files[0];

 const thumb=document
  .getElementById('thumbnailFile')
  .files[0];

 const status=document
  .getElementById('uploadStatus');

 if(!title || !channelId || !video){

  alert('Title, channel and video are required.');

  return;

 }

 status.textContent='Uploading video...';

 const videoPath=
  currentUser.id+'/'+Date.now()+'-'+safe(video.name);

 const upload=await supabase.storage
  .from('videos')
  .upload(videoPath,video);

 if(upload.error){

  alert(upload.error.message);

  return;

 }

 const videoUrl=supabase.storage
  .from('videos')
  .getPublicUrl(videoPath)
  .data
  .publicUrl;

 let thumbnailUrl='';

 if(thumb){

  status.textContent='Uploading thumbnail...';

  const thumbPath=
   currentUser.id+'/'+Date.now()+'-'+safe(thumb.name);

  const tu=await supabase.storage
   .from('thumbnails')
   .upload(thumbPath,thumb);

  if(!tu.error){

   thumbnailUrl=supabase.storage
    .from('thumbnails')
    .getPublicUrl(thumbPath)
    .data
    .publicUrl;

  }

 }

 status.textContent='Saving video...';

 const {error}=await supabase
  .from('videos')
  .insert({
   owner_id:currentUser.id,
   channel_id:channelId,
   title:title,
   description:description,
   video_url:videoUrl,
   thumbnail_url:thumbnailUrl
  });

 if(error){

  alert(error.message);

  return;

 }

 status.textContent='Upload successful!';

 setTimeout(()=>{

  closeModal('uploadModal');

  home();

 },1000);

}

/* =====================================================
   HELPERS
   ===================================================== */

function safe(name){

 return name.replace(
  /[^a-zA-Z0-9._-]/g,
  '_'
 );

}


function esc(value){

 return String(value ?? '')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}
