<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ViTube — Global Video Platform</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#fff;
 color:#111;
}
button,input{font:inherit}
button{cursor:pointer}

.header{
 height:64px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:8px 14px;
 border-bottom:1px solid #ddd;
 position:sticky;
 top:0;
 background:#fff;
 z-index:1000;
}

.menu-btn{
 border:0;
 background:none;
 font-size:28px;
}

.logo{
 font-size:28px;
 font-weight:800;
 color:#e60023;
 cursor:pointer;
 white-space:nowrap;
}

.search-box{
 display:flex;
 flex:1;
 max-width:650px;
 margin:auto;
}

.search-box input{
 width:100%;
 height:44px;
 border:1px solid #ccc;
 border-radius:24px 0 0 24px;
 padding:0 18px;
 outline:none;
}

.search-box button{
 width:60px;
 border:1px solid #ccc;
 border-left:0;
 border-radius:0 24px 24px 0;
 background:#f5f5f5;
}

.header-right{
 display:flex;
 align-items:center;
 gap:8px;
}

.icon-btn,.avatar{
 border:0;
 background:none;
 font-size:23px;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#e60023;
 color:#fff;
 font-weight:bold;
}

.profile-menu{
 display:none;
 position:absolute;
 right:12px;
 top:58px;
 width:230px;
 background:#fff;
 border:1px solid #ddd;
 border-radius:12px;
 box-shadow:0 8px 30px rgba(0,0,0,.18);
 padding:8px;
 z-index:2000;
}

.profile-menu button{
 width:100%;
 text-align:left;
 border:0;
 background:#fff;
 padding:13px;
 border-radius:8px;
}

.profile-menu button:hover{
 background:#f3f3f3;
}

.layout{
 display:flex;
}

.sidebar{
 width:230px;
 min-height:calc(100vh - 64px);
 border-right:1px solid #eee;
 padding:14px;
 position:fixed;
 left:0;
 top:64px;
 background:#fff;
 z-index:900;
}

.sidebar button{
 display:block;
 width:100%;
 border:0;
 background:#fff;
 text-align:left;
 padding:14px;
 border-radius:9px;
 margin-bottom:4px;
}

.sidebar button:hover{
 background:#f2f2f2;
}

.main{
 margin-left:230px;
 width:calc(100% - 230px);
 padding:20px;
}

.page-title{
 font-size:25px;
 margin:5px 0 20px;
}

.video-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:24px 18px;
}

.video-card{
 cursor:pointer;
}

.thumb{
 width:100%;
 aspect-ratio:16/9;
 background:#ddd;
 border-radius:10px;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:55px;
}

.thumb img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.video-info{
 display:flex;
 gap:10px;
 padding-top:10px;
}

.channel-mini{
 width:38px;
 height:38px;
 border-radius:50%;
 background:#e60023;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 flex:none;
}

.video-title{
 font-weight:700;
 line-height:1.3;
}

.video-meta{
 color:#666;
 font-size:13px;
 margin-top:5px;
}

.watch{
 max-width:1000px;
 margin:auto;
}

.player{
 width:100%;
 aspect-ratio:16/9;
 background:#111;
 border-radius:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#fff;
 overflow:hidden;
}

.player video{
 width:100%;
 height:100%;
 object-fit:contain;
}

.demo-player{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:10px;
}

.demo-player .big-icon{
 font-size:90px;
}

.watch-title{
 font-size:24px;
 font-weight:700;
 margin:18px 0 10px;
}

.channel-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:10px 0;
}

.channel-left{
 display:flex;
 align-items:center;
 gap:10px;
}

.channel-avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 background:#e60023;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
}

.subscribe{
 border:0;
 background:#e60023;
 color:#fff;
 padding:11px 18px;
 border-radius:22px;
 font-weight:bold;
}

.subscribe.subscribed{
 background:#222;
}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:12px 0;
}

.action-btn{
 border:0;
 background:#eee;
 border-radius:22px;
 padding:10px 15px;
}

.description{
 background:#f4f4f4;
 padding:14px;
 border-radius:10px;
 margin:15px 0;
}

.comments{
 margin-top:25px;
}

.comment-form{
 display:flex;
 gap:8px;
}

.comment-form input{
 flex:1;
 padding:12px;
 border:1px solid #ccc;
 border-radius:20px;
}

.comment-form button{
 border:0;
 background:#e60023;
 color:#fff;
 padding:0 18px;
 border-radius:20px;
}

.comment{
 padding:12px 0;
 border-bottom:1px solid #eee;
}

.recommended{
 margin-top:30px;
}

.modal-bg{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.55);
 z-index:3000;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal{
 background:#fff;
 width:100%;
 max-width:430px;
 border-radius:15px;
 padding:22px;
 max-height:90vh;
 overflow:auto;
}

.modal h2{
 margin-top:0;
}

.modal input,.modal textarea{
 width:100%;
 padding:12px;
 margin:7px 0;
 border:1px solid #ccc;
 border-radius:8px;
}

.primary{
 width:100%;
 padding:12px;
 border:0;
 background:#e60023;
 color:#fff;
 border-radius:8px;
 margin-top:8px;
 font-weight:bold;
}

.close{
 float:right;
 border:0;
 background:none;
 font-size:25px;
}

.hidden{
 display:none!important;
}

.empty{
 text-align:center;
 padding:70px 20px;
 color:#666;
}

@media(max-width:900px){
 .sidebar{display:none}
 .main{
  margin-left:0;
  width:100%;
  padding:12px;
 }
 .video-grid{
  grid-template-columns:repeat(2,1fr);
 }
 .logo{font-size:23px}
 .search-box{max-width:none}
}

@media(max-width:600px){
 .header{
  gap:6px;
  padding:8px;
 }
 .logo{font-size:21px}
 .search-box input{
  padding:0 10px;
 }
 .search-box button{
  width:45px;
 }
 .upload-head{display:none}
 .video-grid{
  grid-template-columns:1fr;
  gap:22px;
 }
 .watch-title{
  font-size:19px;
 }
 .player{
  border-radius:0;
  margin-left:-12px;
  width:calc(100% + 24px);
 }
}
</style>
</head>

<body>

<header class="header">

<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div class="logo" onclick="goHome()">ViTube</div>

<div class="search-box">
<input
 id="searchInput"
 type="search"
 placeholder="Search videos..."
 onkeydown="if(event.key==='Enter')searchVideos()">
<button onclick="searchVideos()">🔍</button>
</div>

<div class="header-right">
<button class="icon-btn" onclick="openUpload()">＋</button>
<button class="icon-btn" onclick="showNotifications()">🔔</button>
<button class="avatar" id="headerAvatar" onclick="toggleProfileMenu()">G</button>
</div>

<div class="profile-menu" id="profileMenu">
<button onclick="openAccount()">👤 Account</button>
<button onclick="openUpload()">⬆️ Upload Video</button>
<button onclick="showNotifications()">🔔 Notifications</button>
<button onclick="signOutUser()">🚪 Sign out</button>
</div>

</header>


<div class="layout">

<aside class="sidebar" id="sidebar">

<button onclick="goHome()">🏠 Home</button>
<button onclick="goHome()">🔥 Trending</button>
<button onclick="showSubscriptions()">📺 Subscriptions</button>
<button onclick="openUpload()">⬆️ Upload</button>
<button onclick="openLogin()">🔐 Sign in</button>

</aside>


<main class="main">

<section id="homePage">

<h1 class="page-title">Recommended videos</h1>

<div id="videoGrid" class="video-grid"></div>

</section>


<section id="watchPage" class="hidden">

<div class="watch">

<button onclick="goHome()" class="action-btn">← Back</button>

<div id="watchContent"></div>

</div>

</section>

</main>

</div>


<!-- LOGIN -->

<div class="modal-bg" id="loginModal">

<div class="modal">

<button class="close" onclick="closeModal('loginModal')">×</button>

<h2>Sign in to ViTube</h2>

<input id="loginEmail" type="email" placeholder="Email">

<input id="loginPassword" type="password" placeholder="Password">

<button class="primary" onclick="signInUser()">Sign in</button>

<p>
Don't have an account?
<button onclick="switchToSignup()" style="border:0;background:none;color:#e60023">
Create account
</button>
</p>

</div>
</div>


<!-- SIGNUP -->

<div class="modal-bg" id="signupModal">

<div class="modal">

<button class="close" onclick="closeModal('signupModal')">×</button>

<h2>Create your ViTube account</h2>

<input id="signupEmail" type="email" placeholder="Email">

<input id="signupPassword" type="password" placeholder="Password">

<button class="primary" onclick="signUpUser()">Create account</button>

<p>
Already have an account?
<button onclick="switchToLogin()" style="border:0;background:none;color:#e60023">
Sign in
</button>
</p>

</div>
</div>


<!-- ACCOUNT -->

<div class="modal-bg" id="accountModal">

<div class="modal">

<button class="close" onclick="closeModal('accountModal')">×</button>

<h2>Your Account</h2>

<div id="accountData"></div>

<button class="primary" onclick="signOutUser()">Sign out</button>

</div>
</div>


<!-- UPLOAD -->

<div class="modal-bg" id="uploadModal">

<div class="modal">

<button class="close" onclick="closeModal('uploadModal')">×</button>

<h2>Upload Video</h2>

<p id="uploadNotice">
Sign in first to upload a video.
</p>

<input id="uploadTitle" placeholder="Video title">

<textarea id="uploadDescription" placeholder="Description"></textarea>

<input id="uploadVideoFile" type="file" accept="video/*">

<button class="primary" onclick="publishVideo()">
Publish Video
</button>

</div>
</div>


<script>

/* ================================
   SUPABASE CONFIG
   ================================ */

const SUPABASE_URL ='https://visiptpbssladdksqerv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY ='sb_publishable_2toqXCSHl0QiQQEBNI2Fzg_AbAN5v6-';
let supabaseClient = null;

if(
 SUPABASE_URL &&
 SUPABASE_PUBLISHABLE_KEY &&
 !SUPABASE_URL.includes('PASTE_') &&
 !SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')
){
 try{
  supabaseClient = window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_PUBLISHABLE_KEY,
   {
    auth:{
     autoRefreshToken:true,
     persistSession:true,
     detectSessionInUrl:true
    }
   }
  );
 }catch(error){
  console.error(error);
 }
}


/* ================================
   DEMO VIDEOS
   ================================ */

const demoVideos = [

{
 id:'demo1',
 title:'Amazing World — Discover Our Beautiful Planet',
 channel:'ViTube World',
 icon:'🌍',
 views:'1.2M views',
 time:'2 days ago',
 description:'Explore amazing places around our beautiful planet.'
},

{
 id:'demo2',
 title:'The Future of Technology Is Here',
 channel:'ViTube Tech',
 icon:'💻',
 views:'845K views',
 time:'5 days ago',
 description:'Discover how technology is changing our future.'
},

{
 id:'demo3',
 title:'Amazing Food Around The World',
 channel:'ViTube Food',
 icon:'🍔',
 views:'623K views',
 time:'1 week ago',
 description:'A journey through delicious food from around the world.'
},

{
 id:'demo4',
 title:'Earth From Above — Beautiful Places',
 channel:'ViTube Travel',
 icon:'🌎',
 views:'412K views',
 time:'2 weeks ago',
 description:'See some of the most beautiful places on Earth.'
}

];


let currentUser = null;
let currentWatchVideo = null;
let searchResults = demoVideos;


/* ================================
   HOME
   ================================ */

function renderHome(list = demoVideos){

 const grid = document.getElementById('videoGrid');

 if(!grid) return;

 if(!list.length){

  grid.innerHTML = `
  <div class="empty">
   <h2>No videos found</h2>
   <p>Try another search.</p>
  </div>
  `;

  return;
 }

 grid.innerHTML = list.map(video => `

 <article class="video-card" onclick="openDemoWatch('${video.id}')">

   <div class="thumb">
     <div>${video.icon}</div>
   </div>

   <div class="video-info">

     <div class="channel-mini">
       ${video.channel.charAt(0)}
     </div>

     <div>

       <div class="video-title">
         ${escapeHtml(video.title)}
       </div>

       <div class="video-meta">
         ${escapeHtml(video.channel)}
         <br>
         ${escapeHtml(video.views)} • ${escapeHtml(video.time)}
       </div>

     </div>

   </div>

 </article>

 `).join('');
}


/* ================================
   WATCH PAGE
   ================================ */

function openDemoWatch(id){

 const video = demoVideos.find(v => v.id === id);

 if(!video) return;

 currentWatchVideo = video;

 document.getElementById('homePage').classList.add('hidden');
 document.getElementById('watchPage').classList.remove('hidden');

 const content = document.getElementById('watchContent');

 content.innerHTML = `

 <div class="player">

   <div class="demo-player">

     <div class="big-icon">${video.icon}</div>

     <div>ViTube Demo Video</div>

   </div>

 </div>

 <div class="watch-title">
   ${escapeHtml(video.title)}
 </div>

 <div class="channel-row">

   <div class="channel-left">

     <div class="channel-avatar">
       ${video.channel.charAt(0)}
     </div>

     <strong>${escapeHtml(video.channel)}</strong>

   </div>

   <button
    id="subscribeBtn"
    class="subscribe"
    onclick="subscribeChannel('${video.channel}')">
    Subscribe
   </button>

 </div>

 <div class="actions">

   <button class="action-btn" onclick="likeVideo()">👍 Like</button>

   <button class="action-btn" onclick="dislikeVideo()">👎 Dislike</button>

   <button class="action-btn" onclick="shareVideo()">↗ Share</button>

   <button class="action-btn" onclick="copyVideoLink()">🔗 Copy Link</button>

 </div>

 <div class="description">

   ${escapeHtml(video.description)}

 </div>

 <div class="comments">

   <h2>Comments</h2>

   <div class="comment-form">

    <input
     id="commentInput"
     placeholder="Add a comment...">

    <button onclick="addComment()">Post</button>

   </div>

   <div id="commentList">

    <div class="comment">
      Be the first to comment.
    </div>

   </div>

 </div>

 <div class="recommended">

   <h2>Recommended videos</h2>

   <div id="recommendedGrid" class="video-grid"></div>

 </div>

 `;

 renderRecommended();

 window.scrollTo(0,0);
}


/* ================================
   RECOMMENDED
   ================================ */

function renderRecommended(){

 const grid = document.getElementById('recommendedGrid');

 if(!grid) return;

 grid.innerHTML = demoVideos
 .filter(v => !currentWatchVideo || v.id !== currentWatchVideo.id)
 .map(video => `

 <article class="video-card"
 onclick="openDemoWatch('${video.id}')">

   <div class="thumb">
     <div>${video.icon}</div>
   </div>

   <div class="video-info">

     <div class="channel-mini">
       ${video.channel.charAt(0)}
     </div>

     <div>

       <div class="video-title">
         ${escapeHtml(video.title)}
       </div>

       <div class="video-meta">
         ${escapeHtml(video.channel)}
         <br>
         ${escapeHtml(video.views)}
       </div>

     </div>

   </div>

 </article>

 `).join('');
}


/* ================================
   HOME
   ================================ */

function goHome(){

 document.getElementById('watchPage').classList.add('hidden');
 document.getElementById('homePage').classList.remove('hidden');

 renderHome();

 window.scrollTo(0,0);
}


/* ================================
   SEARCH
   ================================ */

function searchVideos(){

 const q = document
 .getElementById('searchInput')
 .value
 .trim()
 .toLowerCase();

 if(!q){

  renderHome(demoVideos);
  return;
 }

 searchResults = demoVideos.filter(video =>
   video.title.toLowerCase().includes(q) ||
   video.channel.toLowerCase().includes(q)
 );

 document.getElementById('watchPage').classList.add('hidden');
 document.getElementById('homePage').classList.remove('hidden');

 renderHome(searchResults);
}


/* ================================
   SUBSCRIBE
   ================================ */

async function subscribeChannel(channel){

 if(!currentUser){

  openLogin();

  return;
 }

 const button = document.getElementById('subscribeBtn');

 if(button){

  button.textContent = 'Subscribed';
  button.classList.add('subscribed');

 }

 alert('Subscribed to ' + channel);

}


/* ================================
   LIKE
   ================================ */

function likeVideo(){

 if(!currentUser){

  openLogin();
  return;

 }

 alert('Liked 👍');

}


/* ================================
   DISLIKE
   ================================ */

function dislikeVideo(){

 if(!currentUser){

  openLogin();
  return;

 }

 alert('Disliked');

}


/* ================================
   SHARE
   ================================ */

async function shareVideo(){

 const url = window.location.href;

 if(navigator.share){

  try{

   await navigator.share({
    title:currentWatchVideo?.title || 'ViTube',
    url:url
   });

  }catch(e){}

 }else{

  await copyText(url);

  alert('Link copied');

 }

}


/* ================================
   COPY LINK
   ================================ */

async function copyVideoLink(){

 await copyText(window.location.href);

 alert('Video link copied');

}


/* ================================
   COMMENT
   ================================ */

function addComment(){

 if(!currentUser){

  openLogin();
  return;

 }

 const input = document.getElementById('commentInput');

 if(!input) return;

 const text = input.value.trim();

 if(!text) return;

 const list = document.getElementById('commentList');

 const comment = document.createElement('div');

 comment.className='comment';

 comment.textContent = text;

 list.prepend(comment);

 input.value='';

}


/* ================================
   LOGIN
   ================================ */

function openLogin(){

 closeAllModals();

 document.getElementById('loginModal').style.display='flex';

}

function switchToSignup(){

 closeAllModals();

 document.getElementById('signupModal').style.display='flex';

}

function switchToLogin(){

 closeAllModals();

 document.getElementById('loginModal').style.display='flex';

}


/* ================================
   SIGN UP
   ================================ */

async function signUpUser(){

 const email =
 document.getElementById('signupEmail').value.trim();

 const password =
 document.getElementById('signupPassword').value;

 if(!email || !password){

  alert('Please enter email and password.');

  return;
 }

 if(password.length < 6){

  alert('Password must be at least 6 characters.');

  return;
 }

 if(!supabaseClient){

  alert('Supabase is not connected yet.');

  return;
 }

 const {data,error} =
 await supabaseClient.auth.signUp({
  email,
  password
 });

 if(error){

  alert(error.message);

  return;
 }

 alert(
  'Account created. Please check your email and confirm your account.'
 );

 closeAllModals();

}


/* ================================
   SIGN IN
   ================================ */

async function signInUser(){

 const email =
 document.getElementById('loginEmail').value.trim();

 const password =
 document.getElementById('loginPassword').value;

 if(!email || !password){

  alert('Please enter email and password.');

  return;
 }

 if(!supabaseClient){

  alert('Supabase is not connected yet.');

  return;
 }

 const {data,error} =
 await supabaseClient.auth.signInWithPassword({
  email,
  password
 });

 if(error){

  alert(error.message);

  return;
 }

 currentUser = data.user;

 updateHeader();

 closeAllModals();

 alert('Signed in successfully!');

}


/* ================================
   SIGN OUT
   ================================ */

async function signOutUser(){

 if(supabaseClient){

  await supabaseClient.auth.signOut();

 }

 currentUser=null;

 updateHeader();

 closeAllModals();

}


/* ================================
   ACCOUNT
   ================================ */

function openAccount(){

 closeProfileMenu();

 if(!currentUser){

  openLogin();

  return;
 }

 document.getElementById('accountData').innerHTML = `

 <p><strong>Email:</strong></p>

 <p>${escapeHtml(currentUser.email || '')}</p>

 <p><strong>Status:</strong> Signed in</p>

 `;

 document.getElementById('accountModal').style.display='flex';

}


/* ================================
   UPLOAD
   ================================ */

function openUpload(){

 closeProfileMenu();

 if(!currentUser){

  openLogin();

  return;
 }

 document.getElementById('uploadNotice').textContent =
 'Upload section is ready. Storage connection will be added next.';

 document.getElementById('uploadModal').style.display='flex';

}

async function publishVideo(){
  if(!currentUser){
    openLogin();
    return;
  }

  const title = document.getElementById('uploadTitle').value.trim();
  const description = document.getElementById('uploadDescription').value.trim();
  const videoFile = document.getElementById('uploadVideoFile').files[0];

  if(!title || !videoFile){
    alert('Please enter a video title and select a video file.');
    return;
  }

  if(!supabaseClient){
    alert('Supabase is not connected.');
    return;
  }

  try{

    if(!window.tus){

      await new Promise((resolve,reject)=>{

        const script = document.createElement('script');

        script.src =
          'https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js';

        script.onload = resolve;

        script.onerror = () =>
          reject(new Error('Upload system could not be loaded.'));

        document.head.appendChild(script);

      });

    }

    const { data: sessionData } =
      await supabaseClient.auth.getSession();

    const session = sessionData.session;

    if(!session){
      alert('Your session has expired. Please sign in again.');
      return;
    }

    const safeName =
      videoFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');

    const filePath =
      currentUser.id + '/' +
      Date.now() + '_' +
      safeName;

    const uploadNotice =
      document.getElementById('uploadNotice');

    uploadNotice.textContent = 'Uploading: 0%';

    await new Promise((resolve,reject)=>{

      const upload = new tus.Upload(videoFile,{

        endpoint:
          'https://visiptpbssladdksqerv.storage.supabase.co/storage/v1/upload/resumable',

        retryDelays:
          [0,3000,5000,10000,20000],

        headers:{
          authorization:
            'Bearer ' + session.access_token,

          'x-upsert':'false'
        },

        uploadDataDuringCreation:true,

        removeFingerprintOnSuccess:true,

        metadata:{
          bucketName:'videos',
          objectName:filePath,
          contentType:
            videoFile.type || 'video/mp4',
          cacheControl:'3600'
        },

        onError:function(error){
          reject(error);
        },

        onProgress:function(bytesUploaded,bytesTotal){

          const percent =
            Math.round(
              (bytesUploaded / bytesTotal) * 100
            );

          uploadNotice.textContent =
            'Uploading: ' + percent + '%';
        },

        onSuccess:function(){
          resolve();
        }

      });

      upload.findPreviousUploads()
        .then(function(previousUploads){

          if(previousUploads.length){

            upload.resumeFromPreviousUpload(
              previousUploads[0]
            );

          }

          upload.start();

        })
        .catch(reject);

    });

    const { data } =
      supabaseClient
        .storage
        .from('videos')
        .getPublicUrl(filePath);

    alert('Video uploaded successfully!');

    console.log('Video URL:',data.publicUrl);
    console.log('Title:',title);
    console.log('Description:',description);

    closeModal('uploadModal');

  }catch(error){

    console.error(error);

    alert(
      'Video upload failed: ' +
      (error.message || error)
    );

  }
}


/* ================================
   NOTIFICATIONS
   ================================ */

function showNotifications(){

 if(!currentUser){

  openLogin();

  return;
 }

 alert('No new notifications.');

}


/* ================================
   SUBSCRIPTIONS
   ================================ */

function showSubscriptions(){

 if(!currentUser){

  openLogin();

  return;
 }

 alert('Your subscribed channels will appear here.');

}


/* ================================
   SIDEBAR
   ================================ */

function toggleSidebar(){

 const sidebar =
 document.getElementById('sidebar');

 if(window.innerWidth <= 900){

  sidebar.style.display =
  sidebar.style.display === 'block'
  ? 'none'
  : 'block';

 }

}


/* ================================
   PROFILE MENU
   ================================ */

function toggleProfileMenu(){

 const menu =
 document.getElementById('profileMenu');

 menu.style.display =
 menu.style.display === 'block'
 ? 'none'
 : 'block';

}

function closeProfileMenu(){

 const menu =
 document.getElementById('profileMenu');

 if(menu){

  menu.style.display='none';

 }

}


/* ================================
   HEADER
   ================================ */

function updateHeader(){

 const avatar =
 document.getElementById('headerAvatar');

 if(currentUser){

  avatar.textContent =
  (currentUser.email || 'U')
  .charAt(0)
  .toUpperCase();

 }else{

  avatar.textContent='G';

 }

}


/* ================================
   MODALS
   ================================ */

function closeModal(id){

 const modal =
 document.getElementById(id);

 if(modal){

  modal.style.display='none';

 }

}

function closeAllModals(){

 document
 .querySelectorAll('.modal-bg')
 .forEach(modal => {
  modal.style.display='none';
 });

}


/* ================================
   HELPERS
   ================================ */

async function copyText(text){

 try{

  await navigator.clipboard.writeText(text);

 }catch(error){

  const area=document.createElement('textarea');

  area.value=text;

  document.body.appendChild(area);

  area.select();

  document.execCommand('copy');

  area.remove();

 }

}


function escapeHtml(value){

 return String(value)
 .replace(/&/g,'&amp;')
 .replace(/</g,'&lt;')
 .replace(/>/g,'&gt;')
 .replace(/"/g,'&quot;')
 .replace(/'/g,'&#039;');

}


/* ================================
   START APP
   ================================ */

async function initApp(){

 renderHome();

 updateHeader();

 if(!supabaseClient){

  console.log(
   'ViTube running in demo mode. Supabase is not connected yet.'
  );

  return;
 }

 try{

  const {data} =
  await supabaseClient.auth.getUser();

  if(data && data.user){

   currentUser=data.user;

   updateHeader();

  }

 }catch(error){

  console.log(error);

 }

}


/* ================================
   CLOSE PROFILE WHEN CLICKING OUTSIDE
   ================================ */

document.addEventListener('click',function(event){

 const menu=document.getElementById('profileMenu');

 const avatar=document.getElementById('headerAvatar');

 if(
  menu &&
  avatar &&
  !menu.contains(event.target) &&
  !avatar.contains(event.target)
 ){

  menu.style.display='none';

 }

});


initApp();

</script>
